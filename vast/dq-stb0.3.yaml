name: dq-ghost-0.3
resources:
  accelerators: A100_SXM4:1
  # cloud: vast
  # image_id: docker:vllm/vllm-openai:latest
  # disk_size: 100

workdir: .

setup: |
  pip install uv
  uv venv
  uv sync --group cuda

run: |
  uv run python scripts/run.py \
  --config-name=dq_expts \
  'env_params.env_params.max_active_trips=2' \
  '+env_params.env_params.ghost_max_lifespan=2500' \
  '+env_params.env_params.max_groups=2500' \
  '+env_params.env_params.max_ghosts_per_group=16' \
  'env.savings_threshold_B=0.3' \
  "run.output_path=s3://research/dq/$VASTLAUNCH_JOB_ID/"

envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com

secrets:
  WANDB_API_KEY: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
  
