name: smoke-dq
resources:
  accelerators: A100_SXM4:1

workdir: .

setup: |
  uv venv

run: |
  uv run python scripts/run.py \
  --config-name=dq_expts \
  'env=synthetic_pool' \
  'env_params=synthetic_pool' \
  '+env_params.env_params.ghost_max_lifespan=100' \
  '+env_params.env_params.max_groups=50' \
  'run.n_steps=20' \
  'run.n_envs=400' \
  'run.num_trials=5' \
  'run.estimate_every_n_steps=10' \
  "run.output_path=s3://research/dq/smoke/run.csv"

envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com

secrets:
  WANDB_API_KEY: null
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
