name: dq-ridge-0.15
resources:
  accelerators: A100_SXM4:1
  cpus: "8 machine_id!=117301"  # cpu_cores>=8, and not the shared host 117301 (CPU-starved)
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
# LSTD-DQ(lambda) at A=0.2 with the ridge penalty tuned: lambda in {0, 0.8} x ridge grid
# (standardized features), plus Naive on the same trajectories.  Seed 42, 25 envs x 2 trials, 5e5 steps.
run: |
  for stb in $STBS; do
    uv run python scripts/run.py --config-name=lstd_expts \
      "env.savings_threshold_A=0.2" "env.savings_threshold_B=$stb" \
      'estimators.lstd.trace_lambdas=[0.0,0.8]' estimators.lstd.jackknife_blocks=0 \
      '+estimators.lstd.ridges=[1e-6,1e-4,1e-3,1e-2,0.1,1.0,10.0,100.0]' \
      +env_params.env_params.max_groups=1 +env_params.env_params.max_ghosts_per_group=1 \
      +env_params.env_params.ghost_max_lifespan=1 \
      "run.output_path=s3://research/dq/dqridge/$VASTLAUNCH_JOB_ID/dqridge_pair0.2:${stb}.csv"
  done
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  STBS: "0.15"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
