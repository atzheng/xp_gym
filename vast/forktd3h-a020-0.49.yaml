name: dq-forktd3h-a020-0.49
resources:
  accelerators: A100_SXM4:1
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
run: |
  sta=${PAIR%%:*}; stb=${PAIR##*:}
  for seed in $SEEDS; do
    uv run python scripts/run.py --config-name=fork_expts \
      "env.savings_threshold_A=$sta" "env.savings_threshold_B=$stb" \
      '+env_params.env_params.max_groups=1' \
      '+env_params.env_params.max_ghosts_per_group=1' \
      '+env_params.env_params.ghost_max_lifespan=1' \
      'estimators.lstd.trace_lambdas=[0.0]' estimators.lstd.fork_td=true '+estimators.lstd.fork_td_ridges=[1e-5,1e-4,1e-3]' +estimators.lstd.fork_td_basis=16 +estimators.lstd.fork_td_harmonics=2 '+estimators.lstd.fork_td_sub=[[16,0],[16,1],[16,2],[8,0],[8,1],[8,2]]' 'estimators.lstd.fork_horizons=[1,30,100,300,1000]' estimators.lstd.fork_slots=384 \
      estimators.lstd.fork_ghosts=64 run.seed=$seed \
      "run.output_path=s3://research/dq/forktd3/$VASTLAUNCH_JOB_ID/fork_pair${sta}:${stb}_seed${seed}.csv"
  done
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  PAIR: "0.2:0.49"
  SEEDS: "42"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
