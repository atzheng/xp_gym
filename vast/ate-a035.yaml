name: dq-ate-a035
resources:
  accelerators: A100_SXM4:1
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
run: |
  # lambda(p) for A=0.35 pairs: p=0 (all-A) once, then p in {.3,.7,1} per B
  uv run python scripts/lambda_p.py "s3://research/dq/ate3/ate_A0.35_p0_E128.csv" 128 500000 0.35:0.35 2 0.0
  for stb in $STBS; do
    uv run python scripts/lambda_p.py "s3://research/dq/ate3/ate_pair0.35:${stb}_E128.csv" 128 500000 0.35:$stb 2 0.3 0.7 1.0
  done
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  STBS: "0.31 0.39 0.49"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
