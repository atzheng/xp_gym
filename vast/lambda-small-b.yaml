name: dq-lambda-smallb
resources:
  accelerators: A100_SXM4:1
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
run: |
  # p=0 (all-A) does not depend on B: run it once
  uv run python scripts/lambda_p.py "s3://research/dq/ate2/ate_p0_E128.csv" 128 500000 0.0 2 0.0
  for stb in $STBS; do
    uv run python scripts/lambda_p.py "s3://research/dq/ate2/ate_stb${stb}.csv" 128 500000 $stb 2 0.3 0.7 1.0
  done
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  STBS: "0.005 0.01 0.02 0.03 0.05"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
