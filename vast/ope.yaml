name: dq-ope-eval
resources:
  accelerators: A100_SXM4:1
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
# Ghost-free env params (max_groups=1 etc.) are set in ope_tsr_expts.yaml.
run: |
  for stb in $STBS; do
    uv run python scripts/run.py --config-name=ope_tsr_expts \
      "env.savings_threshold_B=$stb" \
      "run.output_path=s3://research/dq/ope/$VASTLAUNCH_JOB_ID/ope_stb${stb}.csv"
  done
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  STBS: "0.1 0.2 0.3"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
