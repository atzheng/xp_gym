name: dq-collect
resources:
  accelerators: A100_SXM4:1
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
run: |
  uv run python scripts/collect_pool.py "s3://research/dq/collect2/stb${STB}_s${SEED}_K${K}" $E 500000 $STB $SEED $K
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  STB: "0.1"
  SEED: "0"
  K: "128"
  E: "8"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
