name: dq-tsri-fix-0.025
resources:
  accelerators: A100_SXM4:1
  cpus: "8 machine_id notin [117301,151502,80398,36492]"  # cpu_cores>=8; excludes hosts that starved or failed our jobs
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
# TSRI rerun at A=0.2 after the fix: complete randomization of cars (exactly round(a_L N) treated)
# and normalization by the realized treated shares.  Same paper-protocol settings as
# vast/paper-ope-tsri-a020-b*.yaml: lambda/mu = 1.618, beta = e^-1.618, k in {1,2}, burn-in 1500.
run: |
  for stb in $STBS; do
    uv run python scripts/run.py --config-name=tsri_expts \
      "env.savings_threshold_A=0.2" "env.savings_threshold_B=$stb" design.market_balance=$MB \
      "estimators.tsri.betas=[$BETA]" +estimators.tsri.burn_in=1500 \
      "run.output_path=s3://research/dq/tsri-fix/$VASTLAUNCH_JOB_ID/tsri_pair0.2:${stb}_mb.csv"
  done
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  STBS: "0.025"
  MB: "1.618"
  BETA: "0.1983"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
