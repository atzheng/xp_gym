name: dq-f-scan4
resources:
  accelerators: A100_SXM4:1
workdir: .
setup: |
  pip install uv
  uv venv
  uv sync --group cuda
run: |
  # f(s) = average reward of the all-s policy (p=1, arm B=s), 128 envs, CRN keys shared with ate_p0_E128
  for s in $SS; do
    uv run python scripts/lambda_p.py "s3://research/dq/fscan/f_s${s}_E128.csv" 128 500000 $s 2 1.0
  done
envs:
  AWS_ENDPOINT_URL: https://bc0a4d3391012c4fb52a9e8e78724da1.r2.cloudflarestorage.com
  SS: "0.125 0.21 0.24 0.26 0.29"
secrets:
  AWS_SECRET_ACCESS_KEY: null
  AWS_ACCESS_KEY_ID: null
