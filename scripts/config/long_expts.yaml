# Asymptotics at A = 0.2: the tuned LSTD-DQ (trace lambda = 0.5) and OPE-LSTD (ridge 1e-8,
# burn-in 5N = 1500) run for 1e7 steps on the same trajectories (seed 42, 25 envs x 2 trials).
defaults:
  - env: rideshare_pool
  - env_params: rideshare_pool
  - design: unit_randomized
  - _self_

run:
  output_path: "output/long_out.csv"
  n_envs: 25
  num_trials: 2
  n_steps: 10000000
  estimate_every_n_steps: 10000
  seed: 42

env:
  savings_threshold_B: 0.1

env_params:
  env_params:
    max_active_trips: 2
    # no ghosts needed (trajectories don't depend on them)
    max_groups: 1
    max_ghosts_per_group: 1
    ghost_max_lifespan: 1

estimators:
  naive:
    _target_: xp_gym.estimators.naive.NaiveEstimator
    use_known_actions: true
  lstd:
    _target_: xp_gym.estimators.lstd_dq_pool.PoolLSTDDQEstimator
    gamma: 1.0
    ridge: 1.0e-6
    trace_lambdas: [0.5]
    chunk: ${run.estimate_every_n_steps}
    thresholds: ["${env.savings_threshold_A}", "${env.savings_threshold_B}"]
    use_zones: true
    jackknife_blocks: 5          # 5 blocks x 200 chunks = 1e7 steps
    jackknife_block_chunks: 200
  ope:
    _target_: xp_gym.estimators.ope_pool.PoolOPEEstimator
    p: ${design.p}
    chunk: ${run.estimate_every_n_steps}
    thresholds: ["${env.savings_threshold_A}", "${env.savings_threshold_B}"]
    use_zones: true
    burn_in: 1500
    cv_blocks: 5
    ridges: [1.0e-8]
    # one-element grids keep the (unused here) fixed-point and online families cheap
    gq_etas: [1.0e-8]
    alphas: [1.0e-2]
    td_eta: 1.0
    gq_eta: 0.0
    gq_beta_ratio: 1.0
