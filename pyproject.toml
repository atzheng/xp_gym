[project]
name = "xp-gym"
version = "0.1.0"
description = ""
authors = [{ name = "Andrew Zheng", email = "azheng92@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jax>=0.5.1,<0.6",
    "flax>=0.10.4,<0.11",
    "chex>=0.1.89,<0.2",
    "jaxtyping>=0.2.38,<0.3",
    "gymnax>=0.0.8,<0.0.9",
    "hydra-core>=1.3.2,<2",
    "or-gymnax",
    "pyarrow>=21.0.0,<22",
    "tqdm>=4.67.1,<5",
    "haversine>=2.9.0,<3",
    "jax-tqdm>=0.4.0,<0.5",
    "s3fs>=2026.4.0,<2027",
]

[dependency-groups]
cuda = ["jax[cuda12]>=0.5.1,<0.6"]

[tool.uv]

[tool.uv.sources]
or-gymnax = { git = "https://github.com/atzheng/or-gymnax.git", branch = "pool" }

[tool.hatch.build.targets.wheel]
packages = ["xp_gym"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
